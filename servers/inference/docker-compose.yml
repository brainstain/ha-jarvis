# ============================================================
# Inference Engine — Power Server (RTX 3090)
# Primary LLM, STT, TTS, Speaker ID, Wake Word
# ============================================================
#
# Phase 1 (default):  ollama, wyoming-whisper, piper-tts, openwakeword, exporters
# Phase 2 (--profile phase2):  + speechbrain
#
# Runs inside the vm-inference guest (VFIO passthrough of the 3090;
# NVIDIA Container Toolkit installed in the guest).
#

networks:
  inference:
    driver: bridge

volumes:
  ollama_models:
  whisper_cache:
  speechbrain_data:
  piper_voices:

services:
  # ── Primary LLM Inference ──────────────────────────────────
  ollama:
    image: ollama/ollama:latest
    container_name: ollama-inference
    restart: unless-stopped
    ports:
      - "11434:11434"
    volumes:
      - ollama_models:/root/.ollama
    environment:
      OLLAMA_HOST: "0.0.0.0"
      OLLAMA_MAX_LOADED_MODELS: "1"
      OLLAMA_KEEP_ALIVE: "-1"
      OLLAMA_NUM_PARALLEL: "4"
      OLLAMA_FLASH_ATTENTION: "1"
      NVIDIA_VISIBLE_DEVICES: all
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
        limits:
          memory: 32G
    networks:
      - inference
    healthcheck:
      # curl is not shipped in the ollama image; the ollama CLI is.
      test: ["CMD", "ollama", "list"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 240s

  # ── Ollama Prometheus Metrics ──────────────────────────────
  # prometheus.yml job "ollama-inference" scrapes this host on :9091;
  # without this exporter that job (and the OllamaInferenceDown alert)
  # is permanently down.
  ollama-metrics:
    image: ghcr.io/norskhelsenett/ollama-metrics:latest
    container_name: ollama-metrics-inference
    restart: unless-stopped
    ports:
      - "9091:9091"
    environment:
      OLLAMA_URL: "http://ollama:11434"
    networks:
      - inference
    depends_on:
      - ollama

  # ── Speech-to-Text (Wyoming) ───────────────────────────────
  # rhasspy/wyoming-faster-whisper speaks the Wyoming protocol that
  # Home Assistant's assist pipeline requires. The previously used
  # fedirz/faster-whisper-server exposes an OpenAI-style REST API
  # (not Wyoming) and has been renamed upstream to "speaches".
  wyoming-whisper:
    image: rhasspy/wyoming-faster-whisper:latest
    container_name: wyoming-whisper
    restart: unless-stopped
    ports:
      - "10300:10300"
    volumes:
      - whisper_cache:/data
    command: >
      --model large-v3-turbo
      --device cuda
      --compute-type float16
      --language en
      --beam-size 5
      --uri tcp://0.0.0.0:10300
      --data-dir /data
      --download-dir /data
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
        limits:
          memory: 4G
    networks:
      - inference
    healthcheck:
      # Wyoming images don't reliably ship nc/curl; they do ship python3.
      test: ["CMD-SHELL", "python3 -c \"import socket; socket.create_connection(('localhost',10300),2)\""]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  # ── Text-to-Speech ─────────────────────────────────────────
  piper-tts:
    image: rhasspy/wyoming-piper:latest
    container_name: piper-tts
    restart: unless-stopped
    ports:
      - "10200:10200"
    volumes:
      - piper_voices:/data
    command: >
      --voice en_US-lessac-medium
      --length-scale 1.0
      --noise-scale 0.667
      --noise-w 0.8
      --uri tcp://0.0.0.0:10200
      --download-dir /data
    deploy:
      resources:
        limits:
          memory: 1G
    networks:
      - inference
    healthcheck:
      test: ["CMD-SHELL", "python3 -c \"import socket; socket.create_connection(('localhost',10200),2)\""]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 15s

  # ── Speaker Identification (Phase 2) ───────────────────────
  # CPU by default (DEVICE=cpu) to preserve VRAM — the ECAPA-TDNN
  # model is small; ~2s speaker-ID latency is acceptable.
  #
  # Defaults to the prebuilt image published by
  # .github/workflows/build-speechbrain.yml (avoids compiling torch
  # on the VM). Override SPEECHBRAIN_IMAGE in .env to pin a tag, or
  # run `docker compose --profile phase2 build speechbrain` to build
  # locally from the build context below.
  speechbrain:
    image: ${SPEECHBRAIN_IMAGE:-ghcr.io/brainstain/speechbrain-speaker-id:latest}
    build:
      context: ../../custom-software/speechbrain-speaker-id
      dockerfile: Dockerfile
    container_name: speechbrain
    restart: unless-stopped
    profiles: [phase2]
    ports:
      - "8200:8200"
    volumes:
      - speechbrain_data:/data/speakers
    environment:
      QDRANT_HOST: "agent.home.local"
      QDRANT_PORT: "6333"
      SIMILARITY_THRESHOLD: "0.7"
      DEVICE: "cpu"
    deploy:
      resources:
        limits:
          memory: 3G
    networks:
      - inference
    extra_hosts:
      - "agent.home.local:${AGENT_IP}"
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:8200/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  # ── Wake Word Detection ────────────────────────────────────
  openwakeword:
    image: rhasspy/wyoming-openwakeword:latest
    container_name: openwakeword
    restart: unless-stopped
    ports:
      - "10400:10400"
    command: >
      --preload-model hey_jarvis
      --threshold 0.5
      --trigger-level 3
      --uri tcp://0.0.0.0:10400
    deploy:
      resources:
        limits:
          memory: 1G
    networks:
      - inference
    healthcheck:
      test: ["CMD-SHELL", "python3 -c \"import socket; socket.create_connection(('localhost',10400),2)\""]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s

  # ── Monitoring Exporters ───────────────────────────────────
  nvidia-gpu-exporter:
    image: utkuozdemir/nvidia_gpu_exporter:latest
    container_name: nvidia-gpu-exporter
    restart: unless-stopped
    ports:
      - "9835:9835"
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    networks:
      - inference

  node-exporter:
    image: prom/node-exporter:latest
    container_name: node-exporter
    restart: unless-stopped
    ports:
      - "9100:9100"
    command:
      - '--path.rootfs=/host'
    volumes:
      - /:/host:ro,rslave
    networks:
      - inference
