# ============================================================
# LiteLLM Proxy Configuration — Agent Node
# ============================================================
#
# Model tiers:
#   assistant-fast  → qwen3:1.7b  (routing + simple synthesis, <2s)
#   assistant       → qwen3:30b   (complex/research, priority 1)
#                  → qwen3:8b    (fallback if inference unreachable)
#
# Qwen3 thinking mode: "think" is a TOP-LEVEL Ollama API parameter.
# Use extra_body (not options.think) so LiteLLM passes it correctly.
# ============================================================

model_list:
  # Fast: routing, tool selection, and simple-graph synthesis (Qwen3-4B)
  - model_name: "assistant-fast"
    litellm_params:
      model: "ollama/qwen3:4b"
      api_base: "http://ollama:11434"
      timeout: 30
      extra_body:
        think: false

  # Primary reasoning — Qwen3-30B-A3B on RTX 3090
  - model_name: "assistant"
    litellm_params:
      model: "ollama/qwen3:30b"
      api_base: "http://inference.home.local:11434"
      timeout: 120
      extra_body:
        think: false
    model_info:
      priority: 1

  # Fallback reasoning — Qwen3-8B on GTX 1080 Ti
  - model_name: "assistant"
    litellm_params:
      model: "ollama/qwen3:8b"
      api_base: "http://ollama:11434"
      timeout: 90
      extra_body:
        think: false
    model_info:
      priority: 2

  # Embeddings — nomic-embed-text on GTX 1080 Ti
  - model_name: "embeddings"
    litellm_params:
      model: "ollama/nomic-embed-text:v1.5"
      api_base: "http://ollama:11434"

router_settings:
  routing_strategy: "simple-shuffle"
  num_retries: 2
  timeout: 120
  retry_after: 5
  fallbacks: [{"assistant": ["assistant"]}]
  allowed_fails: 3
  cooldown_time: 60
