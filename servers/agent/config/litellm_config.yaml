# ============================================================
# LiteLLM Proxy Configuration — Agent Node
# ============================================================
#
# Model tiers:
#   assistant   → qwen3:30b (remote RTX 3090, all routing/synthesis/reasoning)
#
# The agent node's GTX 1080 Ti previously ran two additional local tiers
# (qwen3:4b "assistant-fast", qwen3:8b "assistant-local" as a manual
# fallback). Both were removed 2026-09-15: qwen3:4b was empirically
# unreliable for router/synthesis-shaped calls (think:true never
# terminates on JSON classification; think:false returns garbage), and
# testing qwen3:8b as a fallback caused ollama to hang loading it
# alongside qwen3:4b, taking down the card for ~5 min and requiring two
# container restarts to recover — it is not a safe fallback to invoke.
# See agent-orchestrator git history (commit "Fix router/synthesis
# reliability and route them off the broken 1080Ti tier") for details.
#
# Qwen3 thinking mode: "think" is a TOP-LEVEL Ollama API parameter.
# Use extra_body (not options.think) so LiteLLM passes it correctly.
#
# Provider prefix: use "ollama_chat/", not "ollama/". LiteLLM's "ollama/"
# prefix routes through Ollama's legacy /api/generate completion endpoint,
# which does not support native tool-calling or the separate thinking
# field — every tool-selection call silently came back with empty content
# and no tool_calls, regardless of think:true/false. "ollama_chat/" uses
# Ollama's native /api/chat endpoint, where both work correctly.
# ============================================================

model_list:
  # Primary — Qwen3-30B-A3B on remote RTX 3090. Handles routing, tool
  # selection, and synthesis for the whole agent, not just complex/research.
  - model_name: "assistant"
    litellm_params:
      model: "ollama_chat/qwen3:30b"
      api_base: "http://inference.home.local:11434"
      timeout: 120
      extra_body:
        think: true

  # Embeddings — nomic-embed-text on GTX 1080 Ti
  - model_name: "embeddings"
    litellm_params:
      model: "ollama/nomic-embed-text:v1.5"
      api_base: "http://ollama:11434"

router_settings:
  routing_strategy: "simple-shuffle"
  num_retries: 2
  timeout: 120
  retry_after: 5
  allowed_fails: 3
  cooldown_time: 60

litellm_settings:
  # Exposes request/latency/token/cost metrics on GET /metrics
  callbacks: ["prometheus"]
