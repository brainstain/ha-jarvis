global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/alerts.yml

scrape_configs:
  # Prometheus self-monitoring
  - job_name: prometheus
    static_configs:
      - targets: ['localhost:9090']

  # Agent node — system metrics (1080 Ti host)
  - job_name: node-agent
    static_configs:
      - targets: ['node-exporter:9100']
        labels:
          node: agent

  # Agent node — GPU metrics (1080 Ti)
  - job_name: gpu-agent
    static_configs:
      - targets: ['nvidia-gpu-exporter:9835']
        labels:
          node: agent

  # Agent node — Ollama metrics (1080 Ti)
  # Container-to-container traffic goes straight to the container's real
  # listening port (8080); the 9091 host mapping only applies to traffic
  # from outside the "agent" Docker network (e.g. inference.home.local:9091).
  - job_name: ollama-agent
    static_configs:
      - targets: ['ollama-metrics:8080']
        labels:
          node: agent

  # Inference node — system metrics (RTX 3090 host)
  - job_name: node-inference
    static_configs:
      - targets: ['inference.home.local:9100']
        labels:
          node: inference

  # Inference node — GPU metrics (RTX 3090)
  - job_name: gpu-inference
    static_configs:
      - targets: ['inference.home.local:9835']
        labels:
          node: inference

  # Inference node — Ollama metrics (RTX 3090)
  - job_name: ollama-inference
    static_configs:
      - targets: ['inference.home.local:9091']
        labels:
          node: inference

  # Gateway node — system metrics (Mini PC)
  - job_name: node-gateway
    static_configs:
      - targets: ['gateway.home.local:9100']
        labels:
          node: gateway

  # Agent node — Qdrant vector DB
  - job_name: qdrant
    metrics_path: /metrics
    static_configs:
      - targets: ['qdrant:6333']
        labels:
          node: agent

  # Agent node — LiteLLM proxy (requires litellm_settings.callbacks: [prometheus])
  - job_name: litellm
    metrics_path: /metrics
    static_configs:
      - targets: ['litellm:4000']
        labels:
          node: agent

  # Agent node — agent-orchestrator app metrics
  - job_name: agent-orchestrator
    metrics_path: /metrics
    static_configs:
      - targets: ['agent-orchestrator:8100']
        labels:
          node: agent
