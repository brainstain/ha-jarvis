[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "mcp-workflow-status"
version = "0.1.0"
description = "Async workflow and HITL interrupt management MCP server"
requires-python = ">=3.12"
dependencies = [
    "fastmcp>=2.0",
    "httpx>=0.27",
    "structlog>=24.0",
]

[project.scripts]
mcp-workflow-status = "mcp_workflow_status.__main__:main"
