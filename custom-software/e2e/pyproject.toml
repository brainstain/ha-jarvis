[project]
name = "ha-jarvis-e2e"
version = "0.1.0"
description = "End-to-end + response-time test suite for the ha-jarvis stack"
requires-python = ">=3.12"
dependencies = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "httpx[http2]>=0.28",
    "websockets>=13.0",
    "mcp>=1.0",
    "structlog>=24.0",
    "pydantic>=2.10",
    "pydantic-settings>=2.6",
]

[project.optional-dependencies]
# Only needed for the direct MCP stdio tests (test_mcp_servers.py), which
# spawn the real server packages as subprocesses exactly like the
# orchestrator does. Install these (editable) to exercise them locally:
#   pip install -e ../mcp-memory-scoped -e ../mcp-notifications -e ../mcp-workflow-status
mcp-servers = [
    "mcp-memory-scoped",
    "mcp-notifications",
    "mcp-workflow-status",
]

[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["."]
# "../agent-orchestrator/src" lets tests import `agent.mcp.client` directly —
# the same MCPClientHub the orchestrator uses in production — so the MCP
# stdio tests exercise the real client code path, not a reimplementation.
pythonpath = [".", "../agent-orchestrator/src"]
markers = [
    "e2e: end-to-end test against a live (or docker-composed) service",
]
