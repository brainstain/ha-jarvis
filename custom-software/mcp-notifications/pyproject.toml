[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "mcp-notifications"
version = "0.1.0"
description = "Multi-channel notification delivery MCP server"
requires-python = ">=3.12"
dependencies = [
    "fastmcp>=2.0",
    "httpx>=0.27",
    "structlog>=24.0",
]

[project.scripts]
mcp-notifications = "mcp_notifications.__main__:main"
