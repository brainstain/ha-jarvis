[project]
name = "wyoming-identify-proxy"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "wyoming>=1.5",
    "aiohttp>=3.9",
    "httpx>=0.27",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["."]
include = ["app.py"]
