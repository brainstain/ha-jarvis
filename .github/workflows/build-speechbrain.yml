name: Build SpeechBrain Speaker ID

# Builds the custom SpeechBrain ECAPA-TDNN speaker identification image
# and publishes it to GHCR, so the inference node can pull a prebuilt
# image instead of compiling torch on the VM at deploy time.
#
# Published as: ghcr.io/<owner>/speechbrain-speaker-id:<tag>

on:
  push:
    branches: [main]
    paths:
      - 'custom-software/speechbrain-speaker-id/**'
      - '.github/workflows/build-speechbrain.yml'
  pull_request:
    paths:
      - 'custom-software/speechbrain-speaker-id/**'
      - '.github/workflows/build-speechbrain.yml'
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository_owner }}/speechbrain-speaker-id

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Lint Python source
        run: |
          pip install --quiet ruff
          ruff check custom-software/speechbrain-speaker-id/ || true
          python -m py_compile custom-software/speechbrain-speaker-id/app.py

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # Only log in / push on main — PR builds validate the Dockerfile
      # without publishing.
      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,format=short
            type=ref,event=pr

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: custom-software/speechbrain-speaker-id
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke test the image
        if: github.event_name != 'pull_request'
        run: |
          IMAGE=$(echo "${{ steps.meta.outputs.tags }}" | head -n1)
          echo "Starting $IMAGE (no Qdrant available — expect startup to fail at connect)"
          docker run -d --name sb-smoke -p 8200:8200 \
            -e DEVICE=cpu -e QDRANT_HOST=127.0.0.1 "$IMAGE" || true
          sleep 20
          docker logs sb-smoke 2>&1 | tail -30
          # The container cannot become healthy without Qdrant; this step
          # only verifies the image starts and the app imports cleanly.
          docker rm -f sb-smoke || true
