name: Build and Push Containers

on:
  push:
    branches: [main]
    paths:
      - "custom-software/**"
      - ".github/workflows/build-containers.yml"
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  OWNER: brainstain
  REPO: ha-jarvis

jobs:
  build:
    name: Build ${{ matrix.service }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    strategy:
      fail-fast: false
      matrix:
        include:
          # agent-orchestrator uses custom-software/ as context so it can install
          # MCP server packages (mcp-memory-scoped, mcp-notifications, etc.)
          # that run as stdio subprocesses inside the container.
          - service: agent-orchestrator
            context: custom-software
            dockerfile: custom-software/agent-orchestrator/Dockerfile
            paths: |
              custom-software/agent-orchestrator/**
              custom-software/mcp-memory-scoped/**
              custom-software/mcp-notifications/**
              custom-software/mcp-workflow-status/**
              custom-software/mcp-calendar/**

          - service: mcp-memory-scoped
            context: custom-software/mcp-memory-scoped
            dockerfile: custom-software/mcp-memory-scoped/Dockerfile
            paths: custom-software/mcp-memory-scoped/**

          - service: mcp-notifications
            context: custom-software/mcp-notifications
            dockerfile: custom-software/mcp-notifications/Dockerfile
            paths: custom-software/mcp-notifications/**

          - service: mcp-workflow-status
            context: custom-software/mcp-workflow-status
            dockerfile: custom-software/mcp-workflow-status/Dockerfile
            paths: custom-software/mcp-workflow-status/**

          - service: speechbrain-speaker-id
            context: custom-software/speechbrain-speaker-id
            dockerfile: custom-software/speechbrain-speaker-id/Dockerfile
            paths: custom-software/speechbrain-speaker-id/**

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.OWNER }}/${{ env.REPO }}/${{ matrix.service }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,prefix=sha-,format=short

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}
